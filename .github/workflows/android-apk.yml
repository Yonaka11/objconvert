name: Build StarByGiGi Scanner APK

on:
  push:
    branches: ["main"]
    paths:
      - "starbygigi-inventory-scanner/android-app/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "starbygigi-inventory-scanner/android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starbygigi-inventory-scanner/android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.6"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: starbygigi-scanner-debug-apk
          path: starbygigi-inventory-scanner/android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
